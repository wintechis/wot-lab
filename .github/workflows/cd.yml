name: Deploy

# Only main deploys, so only main needs to build a release. Every other branch
# is covered by CI, which runs the same lint/type-check/smoke gates — building
# and uploading a tarball that can never be deployed was pure duplication.
on:
  push:
    branches:
      - main

# Deploys queue rather than cancel: interrupting one mid-ssh could leave the
# server between releases.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Bun's global cache makes the install a restore rather than a download.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run frontend:build

      # The release is code only. Authored Thing Models are data and live in
      # the shared directory on the server, so they are never in here and never
      # overwritten by a deploy.
      - name: Package release
        run: |
          tar -czf wot-lab-release.tar.gz \
            src frontend/dist package.json bun.lock tsconfig.json eslint.config.js

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "wot-lab-release.tar.gz"
          target: "./"

      # Releases are unpacked side by side and switched with one symlink, so a
      # deploy is not a window in which the app directory is half-replaced, and
      # rolling back is repointing `current` at the previous release.
      - name: Install and restart service
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            ROOT="$HOME/wot-lab"
            RELEASE="$ROOT/releases/$GITHUB_SHA"

            mkdir -p "$RELEASE" "$ROOT/shared/thing-models" "$ROOT/shared/node_modules"
            tar -xzf "$HOME/wot-lab-release.tar.gz" -C "$RELEASE"
            rm -f "$HOME/wot-lab-release.tar.gz"

            # One node_modules shared by every release: dependencies rarely
            # change, so this turns a cold install into a no-op most deploys.
            ln -sfn "$ROOT/shared/node_modules" "$RELEASE/node_modules"
            cd "$RELEASE"
            bun install --frozen-lockfile

            ln -sfn "$RELEASE" "$ROOT/current"
            sudo systemctl restart wotlab.service

            # Keep the last five releases so a rollback has somewhere to go.
            cd "$ROOT/releases"
            ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf || true
