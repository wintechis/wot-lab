name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run linting
      run: bun run lint

    - name: Type-check
      run: bun run build

    - name: Audit dependencies for security vulnerabilities
      run: bun audit --audit-level=moderate

    - name: Validate JSON files (Thing Descriptions, state, config)
      run: |
        echo "Validating JSON files..."
        FILES="$(find src/things -name '*.td.json' -o -name 'state.json') wot-config.json tsconfig.json package.json"
        for f in $FILES; do
          FILE="$f" bun -e "await Bun.file(process.env.FILE).json(); console.log('✓ Valid JSON:', process.env.FILE)" || {
            echo "✗ Invalid JSON: $f"; exit 1;
          }
        done

    - name: Test server startup and WoT availability
      run: |
        echo "Testing server startup..."
        pkill -f ":8043" || true
        sleep 2

        # wot-config.json runs the WoT servient on port 8043
        timeout 30s bun run start &
        SERVER_PID=$!

        echo "Waiting for server to start..."
        sleep 10

        echo "Testing WoT Thing Description endpoint..."
        if curl -f -s http://localhost:8043/counter > /dev/null; then
          echo "✓ Server started successfully and WoT TDs are being served"
        else
          echo "✗ WoT server test failed"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi

        kill $SERVER_PID 2>/dev/null || true
        sleep 3

    - name: Test example clients
      run: |
        echo "Testing example client execution..."
        echo "Testing counter client..."
        timeout 5s bun run counterclient &
        sleep 2
        kill %1 2>/dev/null || true

        echo "Testing lamp client..."
        timeout 5s bun run lampclient &
        sleep 2
        kill %1 2>/dev/null || true

        echo "✓ Example clients can be executed"
